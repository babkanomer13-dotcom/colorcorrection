name: ColorPro updater safety
on:
  push:
    paths: ['colorpro/**', '.github/workflows/colorpro-updater.yml']
  pull_request:
    paths: ['colorpro/**', '.github/workflows/colorpro-updater.yml']
permissions:
  contents: read
jobs:
  updater:
    runs-on: windows-2022
    strategy:
      matrix:
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==8.3.5
      - run: python -m pytest colorpro/tests/test_updates.py -q
